<style>

/* BODY */

body {

    margin:0;
    font-family:Arial,sans-serif;
    background:#f8f8f8;

}



/* NAVBAR */

nav {

    background:#c40000;
    padding:12px 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    position:sticky;
    top:0;

    z-index:1000;

}



/* CONTACT INFO */

.contact-info {

    color:white;
    text-align:center;

}


.contact-info a {

    color:white;
    text-decoration:none;
    font-size:14px;

}


.social-icons img {

    height:20px;
    margin:5px;

}



/* LOGO */

.logo img {

    height:50px;

}



/* MENU */

.menu-items a {

    color:white;
    text-decoration:none;

    margin-left:25px;
    font-weight:bold;

}



/* HAMBURGER */

.hamburger {

    display:none;

    color:white;
    font-size:30px;
    cursor:pointer;

}



/* FORM */

.contact-container {


    max-width:600px;

    margin:50px auto;

    background:white;

    padding:35px;

    border-radius:12px;

    box-shadow:
    0 4px 15px rgba(0,0,0,.15);

}



.contact-container h2 {


    text-align:center;

    color:#c40000;

}



label {

    display:block;

    margin-top:15px;

    font-weight:bold;

}



input,
textarea {


    width:100%;

    padding:12px;

    margin-top:5px;

    border-radius:6px;

    border:1px solid #ccc;

    box-sizing:border-box;

}



button {


    margin-top:20px;

    width:100%;

    padding:14px;

    background:#c40000;

    color:white;

    border:none;

    border-radius:7px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}



button:hover {

    background:#a00000;

}



#status {


text-align:center;

margin-top:15px;

font-weight:bold;


}



footer {


background:#900000;

color:white;

text-align:center;

padding:20px;

margin-top:50px;


}



/* MOBILE */

@media(max-width:768px){


.menu-items {


display:none;

position:absolute;

right:0;

top:60px;

background:#c40000;

width:200px;

padding:15px;


}


.menu-items.show {


display:flex;

flex-direction:column;


}



.menu-items a {

margin:10px 0;

}



.hamburger {

}



}

<div class="contact-container">


<h2>
Na Kontaktoni
</h2>



<form id="contactForm">


<label>
Emri
</label>

<input 
type="text"
id="emri"
required>



<label>
Mbiemri
</label>

<input 
type="text"
id="mbiemri"
required>




<label>
Email
</label>


<input
type="email"
id="email"
required>




<label>
Numër telefoni
</label>


<input
type="tel"
id="telefon"
required>




<label>
Mesazhi / Komenti
</label>


<textarea

id="mesazhi"

rows="6"

required>

</textarea>




<button type="submit">

Dërgo Mesazhin

</button>



<p id="status"></p>


</form>

<footer>


© 2026 Shkolla Pavarësia - Të gjitha të drejtat e rezervuara


</footer>





<script>


function toggleMenu(){

document
.querySelector(".menu-items")
.classList.toggle("show");


}





document
.getElementById("contactForm")
.addEventListener("submit", async function(e){


e.preventDefault();



let status =
document.getElementById("status");



status.innerHTML =
"Duke dërguar...";



let data={


emri:
document.getElementById("emri").value,


mbiemri:
document.getElementById("mbiemri").value,


email:
document.getElementById("email").value,


telefon:
document.getElementById("telefon").value,


mesazhi:
document.getElementById("mesazhi").value


};




try {


let response =
await fetch(

"https://ADRESA-JOTE-E-RENDER.com/contact",

{


method:"POST",

headers:{

"Content-Type":"application/json"

},


body:

JSON.stringify(data)


}

);





let result =
await response.json();



if(result.success){


status.innerHTML =
"✅ Mesazhi u dërgua me sukses!";


document
.getElementById("contactForm")
.reset();



}

else{


status.innerHTML =
"❌ Gabim gjatë dërgimit";


}



}

catch(error){


status.innerHTML =
"❌ Nuk u lidh me serverin";


}



});


</script>
