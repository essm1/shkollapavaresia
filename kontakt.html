<style>

body {

    margin:0;
    font-family:Arial,sans-serif;
    background:#f8f8f8;

}


/* NAVBAR */

nav {

    background:#c40000;

    padding:12px 20px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    position:sticky;

    top:0;

    z-index:1000;

    flex-wrap:wrap;

}


/* CONTACT INFO */

.contact-info {

    text-align:center;

    line-height:1.2;

}


.contact-info a {

    color:white;

    text-decoration:none;

    font-size:14px;

}


.social-icons {

    margin-top:5px;

}


.social-icons img {

    height:20px;

    margin:0 5px;

    cursor:pointer;

    transition:.3s;

}


.social-icons img:hover {

    transform:scale(1.2);

}


/* LOGO */

.logo img {

    height:50px;

}


/* MENU */

.menu-items a {

    color:white;

    text-decoration:none;

    margin-left:25px;

    font-weight:bold;

}


.menu-items a:hover {

    opacity:.8;

}



/* HAMBURGER */

.hamburger {

    display:none;

    font-size:28px;

    color:white;

    cursor:pointer;

}



/* CONTACT FORM */

.contact-container {

    max-width:600px;

    margin:50px auto;

    background:white;

    padding:30px;

    border-radius:10px;

    box-shadow:0 4px 10px rgba(0,0,0,.1);

}


.contact-container h2 {

    color:#c40000;

    text-align:center;

}


.contact-container label {

    display:block;

    margin:10px 0 5px;

    font-weight:bold;

}


.contact-container input,
.contact-container textarea {


    width:100%;

    padding:10px;

    border-radius:5px;

    border:1px solid #ccc;

    box-sizing:border-box;

    margin-bottom:15px;

}



.contact-container button {


    padding:12px 20px;

    width:100%;

    background:#c40000;

    color:white;

    border:none;

    border-radius:5px;

    cursor:pointer;

    font-weight:bold;


}



.contact-container button:hover {

    background:#a00000;

}



/* FOOTER */

footer {

    background:#900000;

    color:white;

    text-align:center;

    padding:18px;

    margin-top:50px;

}



/* WHATSAPP BUTTON */


.whatsapp-float {


    position:fixed;


    width:65px;

    height:65px;


    bottom:25px;


    right:25px;


    background:#25D366;


    border-radius:50%;


    display:flex;

    align-items:center;

    justify-content:center;


    box-shadow:

    0 4px 15px rgba(0,0,0,.3);


    z-index:9999;


    transition:.3s;


}



.whatsapp-float:hover {

    transform:scale(1.1);

}



.whatsapp-float img {

    width:38px;

    height:38px;

}




/* MOBILE */


@media(max-width:768px){


.menu-items {


    display:none;

    flex-direction:column;

    background:#c40000;

    position:absolute;

    top:60px;

    right:0;

    width:200px;

    padding:10px;

    border-radius:5px;

}



.menu-items.show {

    display:flex;

}


.hamburger {

    display:block;

}


.menu-items a {

    margin:10px 0;

}



.whatsapp-float {

    width:60px;

    height:60px;

    bottom:20px;

    right:20px;

}


.whatsapp-float img {

    width:35px;

}



}


</style>
